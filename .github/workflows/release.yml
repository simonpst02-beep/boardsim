# Publie BoardSim.exe dans les « Releases » à chaque étiquette v1.2.3.
# Les logiciels déjà installés la trouvent et proposent la mise à jour.
name: Publier une version

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Compiler BoardSim.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.version=${GITHUB_REF_NAME} -X main.repo=${GITHUB_REPOSITORY}" \
            -o BoardSim.exe .
          sha256sum BoardSim.exe | cut -d' ' -f1 > BoardSim.exe.sha256
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" BoardSim.exe BoardSim.exe.sha256 \
            --title "BoardSim ${GITHUB_REF_NAME}" --generate-notes
